<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Route</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#f4f6f9;
}

.sidebar{
position:fixed;
left:0;
top:0;
width:240px;
height:100vh;
background:#1e293b;
color:white;
}

.sidebar h2{
padding:20px;
text-align:center;
background:#0f172a;
}

.sidebar a{
display:block;
padding:15px 20px;
color:white;
text-decoration:none;
transition:.3s;
}

.sidebar a:hover,
.sidebar .active{
background:#2563eb;
}

.main{
margin-left:240px;
padding:30px;
}

.navbar{
background:white;
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
margin-bottom:25px;
}

.card{
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 4px 15px rgba(0,0,0,.1);
max-width:800px;
}

.card h2{
margin-bottom:20px;
color:#2563eb;
}

label{
display:block;
margin-top:15px;
margin-bottom:8px;
font-weight:600;
}

input,
textarea{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
}

input:focus,
textarea:focus{
outline:none;
border-color:#2563eb;
}

textarea{
resize:vertical;
height:90px;
}

button{
margin-top:25px;
padding:13px 25px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#1d4ed8;
}

@media(max-width:768px){

.sidebar{
position:relative;
width:100%;
height:auto;
}

.main{
margin-left:0;
padding:15px;
}

.card{
max-width:100%;
}

}

</style>

</head>

<body>

<div class="sidebar">

<h2>🚌 Smart Bus</h2>

<a href="dashboard.html">🏠 Dashboard</a>

<a href="add_bus.html">➕ Add Bus</a>

<a href="manage_bus.html">🚌 Manage Bus</a>

<a href="add_route.html" class="active">🛣 Add Route</a>

<a href="manage_route.html">📍 Manage Route</a>

<a href="assign_bus.html">🔗 Assign Bus</a>

<a href="reports.html">📊 Reports</a>

<a href="index.html">🚪 Logout</a>

</div>

<div class="main">

<div class="navbar">

<h2>Add New Route</h2>

<div>Admin 👋</div>

</div>

<div class="card">

<h2>Route Information</h2>

<form>

<label>Route Name</label>
<input type="text" placeholder="Example: Route A">

<label>Source</label>
<input type="text" placeholder="Starting Location">

<label>Destination</label>
<input type="text" placeholder="Ending Location">

<label>Stops</label>
<textarea placeholder="Example: Stop 1, Stop 2, Stop 3"></textarea>

<label>Total Distance (KM)</label>
<input type="number" placeholder="Enter Distance">

<label>Estimated Travel Time</label>
<input type="text" placeholder="Example: 2 Hours">

<button type="button" onclick="saveRoute()">Save Route</button>

</form>

</div>

</div>

<script>

function saveRoute(){

alert("Route Saved Successfully! (Demo)");

}

</script>

</body>
</html>
