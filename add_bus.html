<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Bus</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#f4f6f9;
}

.sidebar{
position:fixed;
left:0;
top:0;
width:240px;
height:100vh;
background:#1e293b;
color:white;
}

.sidebar h2{
padding:20px;
text-align:center;
background:#0f172a;
}

.sidebar a{
display:block;
padding:15px 20px;
color:white;
text-decoration:none;
transition:.3s;
}

.sidebar a:hover,
.sidebar .active{
background:#2563eb;
}

.main{
margin-left:240px;
padding:30px;
}

.navbar{
background:white;
padding:18px 25px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
margin-bottom:30px;
display:flex;
justify-content:space-between;
align-items:center;
}

.form-card{
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 4px 15px rgba(0,0,0,.1);
max-width:700px;
}

.form-card h2{
margin-bottom:25px;
color:#2563eb;
}

label{
display:block;
margin-top:15px;
margin-bottom:8px;
font-weight:500;
}

input,select{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
}

input:focus,
select:focus{
outline:none;
border-color:#2563eb;
}

.btn{
margin-top:25px;
background:#2563eb;
color:white;
border:none;
padding:13px 25px;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

.btn:hover{
background:#1d4ed8;
}

@media(max-width:768px){

.sidebar{
width:100%;
height:auto;
position:relative;
}

.main{
margin-left:0;
padding:20px;
}

}

</style>

</head>

<body>

<div class="sidebar">

<h2>🚌 Smart Bus</h2>

<a href="dashboard.html">🏠 Dashboard</a>

<a href="add_bus.html" class="active">➕ Add Bus</a>

<a href="manage_bus.html">🚌 Manage Bus</a>

<a href="add_route.html">🛣 Add Route</a>

<a href="manage_route.html">📍 Manage Route</a>

<a href="assign_bus.html">🔗 Assign Bus</a>

<a href="reports.html">📊 Reports</a>

<a href="index.html">🚪 Logout</a>

</div>

<div class="main">

<div class="navbar">

<h2>Add New Bus</h2>

<div>Admin 👋</div>

</div>

<div class="form-card">

<h2>Bus Information</h2>

<form>

<label>Bus Number</label>
<input type="text" placeholder="Enter Bus Number">

<label>Bus Name</label>
<input type="text" placeholder="Enter Bus Name">

<label>Bus Type</label>
<select>
<option>AC</option>
<option>Non AC</option>
<option>Sleeper</option>
<option>Luxury</option>
</select>

<label>Capacity</label>
<input type="number" placeholder="Enter Seating Capacity">

<label>Driver Name (Optional)</label>
<input type="text" placeholder="Driver Name">

<label>Status</label>
<select>
<option>Available</option>
<option>Running</option>
<option>Maintenance</option>
</select>

<button class="btn" type="button" onclick="saveBus()">Save Bus</button>

</form>

</div>

</div>

<script>

function saveBus(){

alert("Bus Saved Successfully! (Demo Only)");

}

</script>

</body>
</html>
